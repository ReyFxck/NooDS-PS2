name: PS2 POC Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Keep master development from piling up obsolete full PS2 toolchain builds.
# Manual workflow_dispatch runs use a separate group so a push cannot cancel
# an explicitly requested artifact build.
concurrency:
  group: ps2-poc-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test portable core and dynarec helpers
        run: make -C tests test

  build-ps2:
    needs: test-core
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: apk add --no-cache make

      - name: Toolchain info
        run: |
          echo "PS2SDK=$PS2SDK"
          mips64r5900el-ps2-elf-g++ --version

      - name: Build release ELF
        run: |
          make -f Makefile.ps2 BUILD_REVISION="${{ github.sha }}" BUILD_STATE=clean
          mv noods-ps2.elf noods-ps2-release.elf

      - name: Build profile level 1 ELF
        run: |
          make -f Makefile.ps2 profile BUILD_REVISION="${{ github.sha }}" BUILD_STATE=clean PROFILE_LEVEL=1
          mv noods-ps2.elf noods-ps2-profile-level1.elf

      - name: Build profile level 2 ELF
        run: |
          make -f Makefile.ps2 profile BUILD_REVISION="${{ github.sha }}" BUILD_STATE=clean PROFILE_LEVEL=2
          mv noods-ps2.elf noods-ps2-profile.elf

      - name: Build debug ELF
        run: |
          make -f Makefile.ps2 debug BUILD_REVISION="${{ github.sha }}" BUILD_STATE=clean
          mv noods-ps2.elf noods-ps2-debug.elf

      - name: ELF size report
        run: |
          mips64r5900el-ps2-elf-size noods-ps2-release.elf
          mips64r5900el-ps2-elf-size noods-ps2-profile-level1.elf
          mips64r5900el-ps2-elf-size noods-ps2-profile.elf
          mips64r5900el-ps2-elf-size noods-ps2-debug.elf

      - name: Upload PS2 ELFs
        uses: actions/upload-artifact@v4
        with:
          name: noods-ps2-poc
          path: |
            noods-ps2-release.elf
            noods-ps2-profile-level1.elf
            noods-ps2-profile.elf
            noods-ps2-debug.elf
          if-no-files-found: error
