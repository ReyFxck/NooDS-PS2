name: PS2 POC Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-ps2:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: apk add --no-cache make xorriso python3

      - name: Toolchain info
        run: |
          echo "PS2SDK=$PS2SDK"
          mips64r5900el-ps2-elf-g++ --version

      - name: Build release ELF
        run: make -f Makefile.ps2

      - name: Build debug ELF
        run: |
          mv noods-ps2.elf noods-ps2-release.elf
          make -f Makefile.ps2 debug
          mv noods-ps2.elf noods-ps2-debug.elf

      - name: ELF size report
        run: |
          mips64r5900el-ps2-elf-size noods-ps2-release.elf
          mips64r5900el-ps2-elf-size noods-ps2-debug.elf

      - name: Build bootable PS2 ISO with synthetic self-test data
        run: |
          mkdir -p iso-root
          cp noods-ps2-release.elf iso-root/NOODSPS2.ELF
          cat > iso-root/SYSTEM.CNF <<'EOF'
          BOOT2 = cdrom0:\\NOODSPS2.ELF;1
          VER = 1.00
          VMODE = NTSC
          EOF

          python3 - <<'PY'
          import struct
          from pathlib import Path

          root = Path("iso-root")

          # Synthetic zero-filled boot resources for bring-up only.
          # They are NOT Nintendo BIOS/firmware dumps and are not meant for compatibility testing.
          (root / "BIOS9.BIN").write_bytes(bytes(0x1000))
          (root / "BIOS7.BIN").write_bytes(bytes(0x4000))
          (root / "FIRMWARE.BIN").write_bytes(bytes(0x40000))

          # Minimal synthetic NDS image. ARM9 and ARM7 each execute "B ." forever.
          # This is only for constructor/memory/scheduler bring-up and contains no Nintendo code.
          rom = bytearray(0x8000)
          rom[0x00:0x0C] = b"NOODSPS2POC "
          rom[0x0C:0x10] = b"P2PO"
          rom[0x10:0x12] = b"00"
          struct.pack_into("<IIII", rom, 0x20, 0x4000, 0x02000000, 0x02000000, 4)
          struct.pack_into("<IIII", rom, 0x30, 0x5000, 0x03800000, 0x03800000, 4)
          rom[0x4000:0x4004] = bytes.fromhex("FEFFFFEA")
          rom[0x5000:0x5004] = bytes.fromhex("FEFFFFEA")
          (root / "SELFTEST.NDS").write_bytes(rom)
          PY

          xorriso -as mkisofs \
            -iso-level 1 \
            -V NOODSPS2 \
            -o noods-ps2-poc.iso \
            iso-root

      - name: Upload PS2 POC ELFs
        uses: actions/upload-artifact@v4
        with:
          name: noods-ps2-poc
          path: |
            noods-ps2-release.elf
            noods-ps2-debug.elf
            noods-ps2-poc.iso
          if-no-files-found: error
